// ============================================================
// АУДИО (WebAudio, генерируем всё на лету)
// ============================================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('mousedown', initAudio, { once: true });

// --- Гул моторов (непрерывный, 4 тона) ---
let motorGain = null;
let motorOscs = [];
function startMotors() {
  if (!audioCtx || motorOscs.length) return;
  motorGain = audioCtx.createGain();
  motorGain.gain.value = 0;
  motorGain.connect(audioCtx.destination);

  // Немного шума + 4 осциллятора для "жужжания"
  [110, 165, 220, 330].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i % 2 ? 'sawtooth' : 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0.03;
    osc.connect(g); g.connect(motorGain);
    osc.start();
    motorOscs.push({ osc, gain: g, base: freq });
  });
}

function updateMotorSound(throttle) {
  if (!motorGain) return;
  // throttle 0..1
  const t = Math.max(0, Math.min(1, throttle));
  motorGain.gain.setTargetAtTime(soundEnabled ? 0.25 * t + 0.05 : 0, audioCtx.currentTime, 0.05);
  motorOscs.forEach((m, i) => {
    m.osc.frequency.setTargetAtTime(m.base * (0.8 + t * 0.7), audioCtx.currentTime, 0.05);
  });
}

// --- Выстрел ---
function playShoot() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  // Шумовой всплеск
  const bufferSize = 0.15 * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200;
  filter.Q.value = 1.5;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);

  // Низкий "бум"
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.4, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.16);
}

// --- Взрыв ---
function playExplosion() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  // Длинный шум
  const dur = 1.2;
  const bufferSize = dur * audioCtx.sampleRate;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000, t);
  filter.frequency.exponentialRampToValueAtTime(100, t + dur);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.9, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);

  // Низкий сабвуфер-бас
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + 0.6);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.7, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.8);
}

// --- Попадание ---
function playHit() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(1760, t + 0.08);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.16);
}

// ============================================================
// ЧАСТИЦЫ ВЗРЫВА
// ============================================================
const explosions = [];
function spawnExplosion(pos) {
  const count = 40;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i*3] = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const speed = 3 + Math.random() * 8;
    velocities.push(new THREE.Vector3(
      Math.sin(phi)*Math.cos(theta)*speed,
      Math.cos(phi)*speed,
      Math.sin(phi)*Math.sin(theta)*speed
    ));
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xff6600, size: 0.5, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);

  // Вспышка
  const flash = new THREE.PointLight(0xff8800, 8, 30);
  flash.position.copy(pos);
  scene.add(flash);

  explosions.push({ pts, velocities, life: 0, maxLife: 1.5, flash });
}

function updateExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life += dt;
    const positions = e.pts.geometry.attributes.position.array;
    for (let j = 0; j < e.velocities.length; j++) {
      const v = e.velocities[j];
      v.y -= 9.8 * dt;
      positions[j*3]   += v.x * dt;
      positions[j*3+1] += v.y * dt;
      positions[j*3+2] += v.z * dt;
    }
    e.pts.geometry.attributes.position.needsUpdate = true;
    e.pts.material.opacity = 1 - e.life / e.maxLife;
    e.flash.intensity = 8 * (1 - e.life / e.maxLife);

    if (e.life >= e.maxLife) {
      scene.remove(e.pts);
      scene.remove(e.flash);
      e.pts.geometry.dispose();
      explosions.splice(i, 1);
    }
  }
}

function createStick(el) {
  const knob = el.querySelector('.knob');
  const state = { x: 0, y: 0, active: false, id: null };
  const maxDist = 45;

  function setKnob(dx, dy) {
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function onStart(e) {
    e.preventDefault();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    state.id = t.identifier ?? 'mouse';
    state.active = true;
    el.classList.add('active');
    updateFromEvent(t);
  }
  function onMove(e) {
    if (!state.active) return;
    e.preventDefault();
    let t = null;
    if (e.changedTouches) {
      for (const tt of e.changedTouches) {
        if ((tt.identifier) === state.id) { t = tt; break; }
      }
      if (!t) return;
    } else t = e;
    updateFromEvent(t);
  }
  function onEnd(e) {
    if (!state.active) return;
    e.preventDefault();
    state.active = false;
    state.id = null;
    state.x = 0; state.y = 0;
    setKnob(0, 0);
    el.classList.remove('active');
  }
  function updateFromEvent(t) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) {
      dx = dx / dist * maxDist;
      dy = dy / dist * maxDist;
    }
    setKnob(dx, dy);
    state.x = dx / maxDist;
    state.y = dy / maxDist;
  }

  el.addEventListener('touchstart', onStart, { passive: false });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onEnd, { passive: false });
  el.addEventListener('touchcancel', onEnd, { passive: false });
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  return state;
}

const msgEl = document.getElementById('msg');
const flashEl = document.getElementById('flash');

// Запуск моторов после первого касания
document.addEventListener('touchstart', () => { initAudio(); startMotors(); }, { once: true });
document.addEventListener('mousedown', () => { initAudio(); startMotors(); }, { once: true });

const clock = new THREE.Clock();

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!dead) {
    // --- Стик левый: движение XZ
    const moveInput = new THREE.Vector3(stickL.x, 0, stickL.y);
    const inputMag = Math.min(1, moveInput.length());

    // --- Стик правый: yaw + высота
    const yawInput = stickR.x;      // -1..1
    const altInput = stickR.y;      // -1 (вверх) .. 1 (вниз)

    yaw -= yawInput * 2.2 * dt;

    // Вперёд — направление по yaw
    const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
    const right   = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

    const targetVXZ = new THREE.Vector3()
      .addScaledVector(forward, -stickL.y * 15)  // вверх стик = вперёд
      .addScaledVector(right,    stickL.x * 15);
    velocityXZ.lerp(targetVXZ, 0.15);

    // Высота (правый стик)
    const targetVY = -altInput * 10;
    velocityY += (targetVY - velocityY) * 0.15;

    drone.position.x += velocityXZ.x * dt;
    drone.position.z += velocityXZ.z * dt;
    drone.position.y += velocityY * dt;

    // Ограничение высоты
    if (drone.position.y > 50) { drone.position.y = 50; velocityY = 0; }
    if (drone.position.y < 0) drone.position.y = 0;

    drone.rotation.y = yaw;
    drone.rotation.z = -velocityXZ.dot(right) * 0.02;
    drone.rotation.x =  velocityXZ.dot(forward) * 0.015;

    // --- Звук моторов по "тяге"
    const throttle = Math.min(1, inputMag * 0.5 + Math.abs(altInput) * 0.5 + 0.15);
    updateMotorSound(throttle);

    // --- Стрельба
    fireCooldown -= dt;
    if (firing && fireCooldown <= 0) {
      fireCooldown = 0.12;
      playShoot();

      // Создаём пулю
      const bullet = new THREE.Mesh(bulletGeo, bulletMat);
      const forwardDir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
      const muzzle = drone.position.clone()
        .add(new THREE.Vector3(0, -0.3, 0))
        .addScaledVector(forwardDir, 1.2);
      bullet.position.copy(muzzle);
      bullet.userData.vel = forwardDir.clone().multiplyScalar(60);
      bullet.userData.life = 0;
      scene.add(bullet);
      bullets.push(bullet);

      // Вспышка дула
      const muzzleFlash = new THREE.PointLight(0xffaa00, 5, 8);
      muzzleFlash.position.copy(muzzle);
      scene.add(muzzleFlash);
      setTimeout(() => scene.remove(muzzleFlash), 60);
    }

    // --- Обновление пуль
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.position.addScaledVector(b.userData.vel, dt);
      b.userData.life += dt;

      let hit = false;
      // Попадание по кубикам
      for (let j = cubes.length - 1; j >= 0; j--) {
        if (b.position.distanceTo(cubes[j].position) < 1.2) {
          scene.remove(cubes[j]);
          cubes.splice(j, 1);
          score++;
          scoreEl.textContent = score;
          playHit();
          spawnExplosion(b.position);
          if (score >= 10) showWin();
          hit = true;
          break;
        }
      }

      if (hit || b.userData.life > 3 || b.position.y < 0) {
        scene.remove(b);
        bullets.splice(i, 1);
      }
    }

    // --- Винты
    rotors.forEach((r, i) => {
      r.rotation.y += (i % 2 ? 1 : -1) * (30 + throttle * 60) * dt;
    });

    // --- LED мигает
    led.material.emissiveIntensity = (Math.sin(performance.now() * 0.01) > 0) ? 1 : 0.1;

    // --- Сбор кубиков касанием
    for (let i = cubes.length - 1; i >= 0; i--) {
      const c = cubes[i];
      c.rotation.y += dt * 0.8;
      c.position.y += Math.sin(performance.now() * 0.002 + c.userData.spinOffset) * 0.008;
      if (drone.position.distanceTo(c.position) < 1.5) {
        scene.remove(c);
        cubes.splice(i, 1);
        score++;
        scoreEl.textContent = score;
        playHit();
        if (score >= 10) showWin();
      }
    }

    // --- Проверка взрыва дрона
    const groundY = 0.6; // чуть выше земли
    const speedTotal = Math.hypot(velocityXZ.x, velocityXZ.z, velocityY);
    const hardLanding = drone.position.y <= groundY && (speedTotal > 6 || velocityY < -6);

    if (drone.position.y <= groundY) {
      if (hardLanding) {
        explodeDrone();
      } else {
        drone.position.y = groundY;
        velocityY = 0;
      }
    }

    altEl.textContent = drone.position.y.toFixed(1);
    spdEl.textContent = speedTotal.toFixed(1);
  }

  updateExplosions(dt);

  // ============================================================
  // КАМЕРА
  // ============================================================
  if (viewMode === 'fpv' && !dead) {
    // Камера от лица дрона (FPV)
    const camLocal = new THREE.Vector3(0, 0.1, 1.15);
    const camWorld = camLocal.clone().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const targetPos = drone.position.clone().add(camWorld);

    camera.position.lerp(targetPos, 0.4);

    const lookLocal = new THREE.Vector3(0, 0, 15).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const lookAt = drone.position.clone().add(lookLocal);
    lookAt.y = drone.position.y + 0.2;

    // Плавное следование
    const currentLook = new THREE.Vector3();
    camera.getWorldDirection(currentLook);
    const targetLook = lookAt.clone().sub(camera.position).normalize();
    currentLook.lerp(targetLook, 0.3);
    camera.lookAt(camera.position.clone().add(currentLook));
  } else if (viewMode === 'tps' && !dead) {
    // Вид от третьего лица — сзади и выше
    const camOffset = new THREE.Vector3(0, 3, -7).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const targetPos = drone.position.clone().add(camOffset);
    camera.position.lerp(targetPos, 0.08);

    const lookAt = drone.position.clone();
    lookAt.y += 0.5;
    camera.lookAt(lookAt);
  }

  renderer.render(scene, camera);
}

function showWin() {
  msgEl.textContent = '🎉 Все кубики собраны! 🎉';
  msgEl.classList.add('show');
}

function explodeDrone() {
  if (dead) return;
  dead = true;

  playExplosion();

  // Взрыв на месте дрона
  spawnExplosion(drone.position.clone());
  // Дополнительные взрывы вокруг
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const off = new THREE.Vector3(
        (Math.random()-0.5)*4, Math.random()*2, (Math.random()-0.5)*4
      );
      spawnExplosion(drone.position.clone().add(off));
    }, i * 150);
  }

  // Белая вспышка экрана
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.6s';
    flashEl.style.opacity = '0';
  });

  // Скрываем дрон
  drone.visible = false;

  // Останавливаем звук моторов
  if (motorGain) motorGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);

  // Сообщение
  msgEl.textContent = '💥 ДРОН РАЗБИЛСЯ 💥';
  msgEl.classList.add('show');

  // Перезапуск через 2.5 сек
  setTimeout(() => {
    dead = false;
    drone.visible = true;
    drone.position.set(0, 8, 0);
    velocityY = 0;
    velocityXZ.set(0,0,0);
    yaw = 0;
    msgEl.classList.remove('show');
    if (motorGain) motorGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
  }, 2500);
}

animate();

// Ресайз
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// БЛОКИРОВКА ВЫДЕЛЕНИЯ И ЖЕСТОВ iOS
// ============================================================
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('gesturechange', e => e.preventDefault());
document.addEventListener('gestureend', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
// Двойной тап — зум
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());
</script>
</body>
</html>
