<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Симулятор дрона FPV</title>
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-user-drag: none; box-sizing: border-box;
  }
  html, body {
    margin:0; padding:0; overflow:hidden;
    background:#000; font-family:-apple-system, sans-serif;
    touch-action: none; overscroll-behavior: none;
    position: fixed; width:100%; height:100%;
  }
  canvas { display:block; position: fixed; top:0; left:0; }

  #hud {
    position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); left:10px;
    color:#0f0; font-family:'Courier New', monospace; font-size:13px;
    text-shadow:0 0 6px #0f0;
    background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:8px;
    pointer-events:none; line-height:1.4;
    border:1px solid rgba(0,255,0,0.3);
  }
  #msg {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:26px; font-weight:bold;
    text-shadow:0 0 20px #f00, 2px 2px 6px #000;
    display:none; text-align:center; pointer-events:none;
    padding:20px 30px; border-radius:14px; background:rgba(0,0,0,0.7);
    z-index: 50;
  }
  #msg.show { display:block; }

  #crosshair {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:#0f0; font-size:22px; pointer-events:none;
    text-shadow:0 0 6px #0f0; z-index: 5;
  }

  .stick {
    position:fixed; width:130px; height:130px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    touch-action:none; z-index: 10;
  }
  .stick .knob {
    position:absolute; width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,0.35);
    border:2px solid rgba(255,255,255,0.7);
    left:50%; top:50%; transform:translate(-50%,-50%);
  }
  .stick.active .knob { background:rgba(0,255,100,0.55); }
  #stickL { left:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }
  #stickR { right:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }

  #fireBtn {
    position:fixed;
    right:calc(170px + env(safe-area-inset-right, 0px));
    bottom:calc(60px + env(safe-area-inset-bottom, 0px));
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,80,0,0.6), rgba(200,0,0,0.6));
    border:3px solid rgba(255,200,0,0.9);
    color:#fff; font-size:34px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    text-shadow:0 0 8px #000; touch-action:none;
    box-shadow:0 0 20px rgba(255,80,0,0.5); z-index: 10;
  }
  #fireBtn:active { background:radial-gradient(circle, rgba(255,200,0,0.9), rgba(255,80,0,0.9)); }

  #viewBtn, #soundBtn {
    position:fixed; right:calc(10px + env(safe-area-inset-right, 0px));
    width:60px; height:60px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.5);
    color:#fff; font-size:26px;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; z-index: 10;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  #viewBtn { top:calc(10px + env(safe-area-inset-top, 0px)); }
  #soundBtn { top:calc(80px + env(safe-area-inset-top, 0px)); }

  #flash {
    position:fixed; inset:0; background:#fff;
    pointer-events:none; opacity:0; z-index:100;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>SCORE: <span id="score">0</span>/10</div>
  <div>ALT: <span id="alt">0</span>m</div>
  <div>SPD: <span id="spd">0</span></div>
  <div>VIEW: <span id="viewMode">FPV</span></div>
</div>
<div id="crosshair">◎</div>
<div id="msg"></div>
<div id="flash"></div>

<div class="stick" id="stickL"><div class="knob"></div></div>
<div class="stick" id="stickR"><div class="knob"></div></div>
<div id="fireBtn">🔥</div>
<div id="viewBtn">👁</div>
<div id="soundBtn">🔊</div>

<script>
// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// ============================================================
// АУДИО
// ============================================================
let audioCtx = null;
let soundEnabled = true;
let motorGain = null, motorOscs = [];

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.warn('Audio fail', e); return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', () => { initAudio(); startMotors(); }, { once: true });
document.addEventListener('mousedown', () => { initAudio(); startMotors(); }, { once: true });

function startMotors() {
  if (!audioCtx || motorOscs.length) return;
  motorGain = audioCtx.createGain();
  motorGain.gain.value = 0;
  motorGain.connect(audioCtx.destination);
  [110, 165, 220, 330].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i % 2 ? 'sawtooth' : 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0.03;
    osc.connect(g); g.connect(motorGain);
    osc.start();
    motorOscs.push({ osc, gain: g, base: freq });
  });
}

function updateMotorSound(throttle) {
  if (!motorGain || !audioCtx) return;
  const t = Math.max(0, Math.min(1, throttle));
  motorGain.gain.setTargetAtTime(soundEnabled ? 0.25 * t + 0.03 : 0, audioCtx.currentTime, 0.05);
  motorOscs.forEach(m => {
    m.osc.frequency.setTargetAtTime(m.base * (0.8 + t * 0.7), audioCtx.currentTime, 0.05);
  });
}

function playShoot() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const bufferSize = Math.floor(0.15 * audioCtx.sampleRate);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++)
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 1.5;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.3, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.16);
}

function playExplosion() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const dur = 1.2;
  const bufferSize = Math.floor(dur * audioCtx.sampleRate);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++)
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.5);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2000, t);
  filter.frequency.exponentialRampToValueAtTime(100, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.8, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start(t);
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + 0.6);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.6, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.8);
}

function playHit() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(1760, t + 0.08);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.16);
}

// ============================================================
// 3D-МАТЕМАТИКА (своя, без библиотек)
// ============================================================
function vec(x, y, z) { return { x, y, z }; }
function vadd(a, b) { return { x:a.x+b.x, y:a.y+b.y, z:a.z+b.z }; }
function vsub(a, b) { return { x:a.x-b.x, y:a.y-b.y, z:a.z-b.z }; }
function vscale(a, s) { return { x:a.x*s, y:a.y*s, z:a.z*s }; }
function vlen(a) { return Math.hypot(a.x, a.y, a.z); }
function vnorm(a) { const l = vlen(a) || 1; return { x:a.x/l, y:a.y/l, z:a.z/l }; }
function vdot(a, b) { return a.x*b.x + a.y*b.y + a.z*b.z; }
function vcross(a, b) {
  return {
    x: a.y*b.z - a.z*b.y,
    y: a.z*b.x - a.x*b.z,
    z: a.x*b.y - a.y*b.x
  };
}

// ============================================================
// МИР
// ============================================================
const drone = {
  pos: vec(0, 8, 0),
  yaw: 0,           // поворот вокруг Y
  pitch: 0,         // наклон вперёд
  roll: 0,          // крен
  vel: vec(0, 0, 0) // скорость по XZ
};
let velocityY = 0;
let score = 0;
let dead = false;
let firing = false;
let fireCooldown = 0;
let viewMode = 'fpv';

// Кубики (мировые координаты)
const cubes = [];
for (let i = 0; i < 10; i++) {
  cubes.push({
    pos: vec(
      (Math.random()-0.5) * 100,
      Math.random() * 15 + 3,
      (Math.random()-0.5) * 100
    ),
    alive: true,
    spin: Math.random() * Math.PI * 2
  });
}

// Деревья / маркеры
const trees = [];
for (let i = 0; i < 40; i++) {
  trees.push({
    pos: vec(
      (Math.random()-0.5) * 200,
      0,
      (Math.random()-0.5) * 200
    ),
    h: 3 + Math.random() * 5
  });
}

// Пули
const bullets = [];
// Взрывы
const explosions = [];
// Вспышки от выстрелов
const muzzleFlashes = [];

// ============================================================
// ПРОЕКЦИЯ
// ============================================================
const FOV = 500;

function worldToCamera(p) {
  // Мир -> камера (позиция камеры + поворот yaw + pitch)
  const dx = p.x - cameraPos.x;
  const dy = p.y - cameraPos.y;
  const dz = p.z - cameraPos.z;

  // Yaw (поворот вокруг Y)
  const cosY = Math.cos(-cameraYaw), sinY = Math.sin(-cameraYaw);
  const x1 = dx * cosY - dz * sinY;
  const z1 = dx * sinY + dz * cosY;

  // Pitch (наклон камеры)
  const cosP = Math.cos(-cameraPitch), sinP = Math.sin(-cameraPitch);
  const y2 = dy * cosP - z1 * sinP;
  const z2 = dy * sinP + z1 * cosP;

  return vec(x1, y2, z2);
}

function project(p) {
  if (p.z <= 0.1) return null;
  const scale = FOV / p.z;
  return {
    x: W/2 + p.x * scale,
    y: H/2 - p.y * scale,
    scale,
    z: p.z
  };
}

// Позиция и поворот камеры (меняются каждый кадр)
let cameraPos = vec(0, 8, -8);
let cameraYaw = 0;
let cameraPitch = 0;

// ============================================================
// РИСОВАНИЕ ПРИМИТИВОВ
// ============================================================
function drawLine3D(a, b, color, width) {
  const ca = worldToCamera(a);
  const cb = worldToCamera(b);
  const pa = project(ca);
  const pb = project(cb);
  if (!pa || !pb) return;

  ctx.strokeStyle = color;
  ctx.lineWidth = width || 1;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
}

function drawBox3D(center, size, color, rotationY) {
  const hs = { x: size.x/2, y: size.y/2, z: size.z/2 };
  // 8 углов куба
  const corners = [
    vec(-hs.x, -hs.y, -hs.z), vec( hs.x, -hs.y, -hs.z),
    vec( hs.x,  hs.y, -hs.z), vec(-hs.x,  hs.y, -hs.z),
    vec(-hs.x, -hs.y,  hs.z), vec( hs.x, -hs.y,  hs.z),
    vec( hs.x,  hs.y,  hs.z), vec(-hs.x,  hs.y,  hs.z)
  ];
  // Вращение вокруг Y
  const cy = Math.cos(rotationY || 0), sy = Math.sin(rotationY || 0);
  const world = corners.map(c => {
    const rx = c.x * cy - c.z * sy;
    const rz = c.x * sy + c.z * cy;
    return vec(center.x + rx, center.y + c.y, center.z + rz);
  });

  // Проекция
  const proj = world.map(p => {
    const cp = worldToCamera(p);
    return project(cp);
  });

  if (proj.some(p => !p)) return;

  // Проверка z (все точки должны быть перед камерой)
  const depths = world.map(p => {
    const cp = worldToCamera(p);
    return cp.z;
  });
  if (depths.some(d => d <= 0.1)) return;

  // Заливка граней (упрощённо — рисуем стороны в порядке дальности)
  const faces = [
    [0,1,2,3], [4,5,6,7], // задняя/передняя
    [0,1,5,4], [1,2,6,5], // бок
    [2,3,7,6], [3,0,4,7]  // бок
  ];
  const faceDepths = faces.map(f => {
    return (depths[f[0]] + depths[f[1]] + depths[f[2]] + depths[f[3]]) / 4;
  });
  const order = faces.map((f, i) => i).sort((a, b) => faceDepths[b] - faceDepths[a]);

  for (const fi of order) {
    const f = faces[fi];
    const d = faceDepths[fi];
    // Затемнение по глубине
    const shade = Math.max(0.3, Math.min(1, 1 - d / 120));
    ctx.fillStyle = shadeColor(color, shade);
    ctx.beginPath();
    ctx.moveTo(proj[f[0]].x, proj[f[0]].y);
    for (let k = 1; k < 4; k++) ctx.lineTo(proj[f[k]].x, proj[f[k]].y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function shadeColor(hex, factor) {
  // hex вида '#rrggbb'
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const rr = Math.floor(r * factor);
  const gg = Math.floor(g * factor);
  const bb = Math.floor(b * factor);
  return `rgb(${rr},${gg},${bb})`;
}

// ============================================================
// РИСОВАНИЕ ДРОНА (в FPV не рисуем, в 3-м лице — да)
// ============================================================
function drawDrone() {
  if (viewMode === 'fpv') return;

  // Корпус
  drawBox3D(drone.pos, vec(1.0, 0.35, 1.4), '#1a1a1a', drone.yaw);
  // Красная крышка сверху
  drawBox3D(
    vec(drone.pos.x, drone.pos.y + 0.25, drone.pos.z),
    vec(0.8, 0.1, 1.0), '#d32f2f', drone.yaw
  );
  // 4 луча + моторы + винты
  const armPos = [
    vec(-0.9, 0, -0.9), vec(0.9, 0, -0.9),
    vec(-0.9, 0, 0.9), vec(0.9, 0, 0.9)
  ];
  const cy = Math.cos(drone.yaw), sy = Math.sin(drone.yaw);
  const spinAngle = performance.now() * 0.03;

  armPos.forEach((p, i) => {
    const rx = p.x * cy - p.z * sy;
    const rz = p.x * sy + p.z * cy;
    const worldP = vec(drone.pos.x + rx, drone.pos.y + p.y, drone.pos.z + rz);

    // Мотор
    drawBox3D(
      vec(worldP.x, worldP.y + 0.05, worldP.z),
      vec(0.35, 0.2, 0.35), '#444444', drone.yaw
    );

    // Винт — 2 лопасти, вращаются
    const bladeAngle = spinAngle * (i % 2 ? 1 : -1) + i;
    for (let k = 0; k < 2; k++) {
      const a = bladeAngle + k * Math.PI/2;
      const bx = Math.cos(a) * 0.4;
      const bz = Math.sin(a) * 0.4;
      drawLine3D(
        vec(worldP.x - bx, worldP.y + 0.2, worldP.z - bz),
        vec(worldP.x + bx, worldP.y + 0.2, worldP.z + bz),
        'rgba(200,200,200,0.85)', 3
      );
    }
  });
}

// ============================================================
// ОБНОВЛЕНИЕ
// ============================================================
function update(dt) {
  if (!dead) {
    // Ввод со стиков
    const yawInput = stickR.x;
    const altInput = stickR.y;
    const fwdInput = -stickL.y;
    const strafeInput = stickL.x;

    drone.yaw -= yawInput * 2.2 * dt;

    // Целевая скорость по XZ
    const fwd = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const right = vec(Math.cos(drone.yaw), 0, -Math.sin(drone.yaw));
    const targetV = {
      x: fwd.x * fwdInput * 15 + right.x * strafeInput * 15,
      y: 0,
      z: fwd.z * fwdInput * 15 + right.z * strafeInput * 15
    };
    drone.vel.x += (targetV.x - drone.vel.x) * 0.15;
    drone.vel.z += (targetV.z - drone.vel.z) * 0.15;

    // Высота
    const targetVY = -altInput * 10;
    velocityY += (targetVY - velocityY) * 0.15;

    // Позиция
    drone.pos.x += drone.vel.x * dt;
    drone.pos.z += drone.vel.z * dt;
    drone.pos.y += velocityY * dt;

    // Ограничения
    if (drone.pos.y > 50) { drone.pos.y = 50; velocityY = 0; }
    if (drone.pos.y < 0) drone.pos.y = 0;

    // Наклон для красоты
    drone.pitch = -fwdInput * 0.25;
    drone.roll = -strafeInput * 0.2;

    // Звук моторов
    const throttle = Math.min(1, Math.abs(fwdInput)*0.5 + Math.abs(strafeInput)*0.3 + Math.abs(altInput)*0.4 + 0.15);
    updateMotorSound(throttle);

    // Стрельба
    fireCooldown -= dt;
    if (firing && fireCooldown <= 0) {
      fireCooldown = 0.12;
      playShoot();
      const dir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
      bullets.push({
        pos: vec(drone.pos.x + dir.x * 1.2, drone.pos.y - 0.3, drone.pos.z + dir.z * 1.2),
        vel: vec(dir.x * 60, 0, dir.z * 60),
        life: 0
      });
      muzzleFlashes.push({
        pos: vec(drone.pos.x + dir.x * 1.4, drone.pos.y - 0.3, drone.pos.z + dir.z * 1.4),
        life: 0
      });
    }

    // Пули
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.pos.x += b.vel.x * dt;
      b.pos.y += b.vel.y * dt;
      b.pos.z += b.vel.z * dt;
      b.life += dt;

      let hit = false;
      for (let j = cubes.length - 1; j >= 0; j--) {
        const c = cubes[j];
        if (vlen(vsub(b.pos, c.pos)) < 1.2) {
          cubes.splice(j, 1);
          score++;
          document.getElementById('score').textContent = score;
          playHit();
          spawnExplosion(c.pos, 0.6);
          if (score >= 10) showWin();
          hit = true;
          break;
        }
      }
      if (hit || b.life > 3 || b.pos.y < 0) bullets.splice(i, 1);
    }

    // Кубики вращаются + сбор при касании
    for (let i = cubes.length - 1; i >= 0; i--) {
      const c = cubes[i];
      c.spin += dt * 1.5;
      if (vlen(vsub(drone.pos, c.pos)) < 1.5) {
        cubes.splice(i, 1);
        score++;
        document.getElementById('score').textContent = score;
        playHit();
        if (score >= 10) showWin();
      }
    }

    // Столкновение с землёй
    const speedTotal = Math.hypot(drone.vel.x, drone.vel.z, velocityY);
    if (drone.pos.y <= 0.6) {
      if (speedTotal > 6 || velocityY < -6) {
        explodeDrone();
      } else {
        drone.pos.y = 0.6;
        velocityY = 0;
      }
    }

    document.getElementById('alt').textContent = drone.pos.y.toFixed(1);
    document.getElementById('spd').textContent = speedTotal.toFixed(1);
  }

  // Взрывы
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life += dt;
    e.particles.forEach(p => {
      p.vel.y -= 9.8 * dt;
      p.pos.x += p.vel.x * dt;
      p.pos.y += p.vel.y * dt;
      p.pos.z += p.vel.z * dt;
    });
    if (e.life >= e.maxLife) explosions.splice(i, 1);
  }

  // Вспышки
  for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
    muzzleFlashes[i].life += dt;
    if (muzzleFlashes[i].life > 0.06) muzzleFlashes.splice(i, 1);
  }

  // ============================================================
  // КАМЕРА
  // ============================================================
  if (viewMode === 'fpv') {
    // Камера на дроне, смотрит вперёд
    const dir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const targetPos = vec(
      drone.pos.x + dir.x * 0.3,
      drone.pos.y + 0.15,
      drone.pos.z + dir.z * 0.3
    );
    cameraPos.x += (targetPos.x - cameraPos.x) * 0.4;
    cameraPos.y += (targetPos.y - cameraPos.y) * 0.4;
    cameraPos.z += (targetPos.z - cameraPos.z) * 0.4;

    // Yaw плавно
    let dYaw = drone.yaw - cameraYaw;
    while (dYaw > Math.PI) dYaw -= Math.PI * 2;
    while (dYaw < -Math.PI) dYaw += Math.PI * 2;
    cameraYaw += dYaw * 0.35;

    cameraPitch += (drone.pitch - cameraPitch) * 0.2;
  } else {
    // 3-е лицо — сзади и выше
    const dir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const targetPos = vec(
      drone.pos.x - dir.x * 7,
      drone.pos.y + 3,
      drone.pos.z - dir.z * 7
    );
    cameraPos.x += (targetPos.x - cameraPos.x) * 0.08;
    cameraPos.y += (targetPos.y - cameraPos.y) * 0.08;
    cameraPos.z += (targetPos.z - cameraPos.z) * 0.08;

    let dYaw = drone.yaw - cameraYaw;
    while (dYaw > Math.PI) dYaw -= Math.PI * 2;
    while (dYaw < -Math.PI) dYaw += Math.PI * 2;
    cameraYaw += dYaw * 0.12;
    cameraPitch += (-0.2 - cameraPitch) * 0.1;
  }
}

function spawnExplosion(pos, scale) {
  scale = scale || 1;
  const count = Math.floor(40 * scale);
  const particles = [];
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const speed = (3 + Math.random() * 8) * scale;
    particles.push({
      pos: vec(pos.x, pos.y, pos.z),
      vel: vec(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed,
        Math.sin(phi) * Math.sin(theta) * speed
      ),
      size: (0.3 + Math.random() * 0.5) * scale
    });
  }
  explosions.push({ particles, life: 0, maxLife: 1.5, origin: pos });
}

// ============================================================
// РЕНДЕР
// ============================================================
function render() {
  // Небо — градиент
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#c8e6f5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Горизонт / земля
  // Рисуем закрашенную нижнюю половину в зависимости от cameraPitch
  const horizonY = H/2 + Math.tan(cameraPitch) * FOV;
  ctx.fillStyle = '#4a8b3a';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Сетка на земле
  const gridSize = 10;
  const gridRange = 20;
  const camX = Math.round(cameraPos.x / gridSize) * gridSize;
  const camZ = Math.round(cameraPos.z / gridSize) * gridSize;

  ctx.lineWidth = 1;
  for (let i = -gridRange; i <= gridRange; i++) {
    const alpha = 0.2 * (1 - Math.abs(i) / gridRange);
    ctx.strokeStyle = `rgba(0,0,0,${alpha})`;

    // Линии вдоль X
    drawGroundLine(
      vec(camX + i * gridSize, 0, camZ - gridRange * gridSize),
      vec(camX + i * gridSize, 0, camZ + gridRange * gridSize)
    );
    // Линии вдоль Z
    drawGroundLine(
      vec(camX - gridRange * gridSize, 0, camZ + i * gridSize),
      vec(camX + gridRange * gridSize, 0, camZ + i * gridSize)
    );
  }

  // Деревья
  trees.forEach(t => {
    if (vlen(vsub(t.pos, cameraPos)) > 80) return;
    drawTree(t);
  });

  // Кубики
  cubes.forEach(c => {
    if (vlen(vsub(c.pos, cameraPos)) > 100) return;
    drawCube(c);
  });

  // Пули
  bullets.forEach(b => {
    const cp = worldToCamera(b.pos);
    const p = project(cp);
    if (!p) return;
    const r = Math.max(2, p.scale * 0.15);
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    // Свечение
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*3);
    g.addColorStop(0, 'rgba(255,200,0,0.8)');
    g.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r*3, 0, Math.PI * 2);
    ctx.fill();
  });

  // Вспышки выстрела
  muzzleFlashes.forEach(f => {
    const cp = worldToCamera(f.pos);
    const p = project(cp);
    if (!p) return;
    const r = p.scale * 0.6 * (1 - f.life / 0.06);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(255,255,180,1)');
    g.addColorStop(0.4, 'rgba(255,180,0,0.7)');
    g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Дрон (только 3-е лицо)
  drawDrone();

  // Взрывы (частицы)
  explosions.forEach(e => {
    const t = e.life / e.maxLife;
    const alpha = 1 - t;
    e.particles.forEach(p => {
      const cp = worldToCamera(p.pos);
      const proj = project(cp);
      if (!proj) return;
      const r = Math.max(1, proj.scale * p.size);
      // Оранжево-жёлтый градиент по времени
      const rCol = 255;
      const gCol = Math.floor(255 * (1 - t) + 100 * t);
      const bCol = Math.floor(50 * (1 - t));
      ctx.fillStyle = `rgba(${rCol},${gCol},${bCol},${alpha})`;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
      ctx.fill();
    });
  });

  // Прицел
  if (viewMode === 'fpv') {
    document.getElementById('crosshair').style.display = 'block';
  } else {
    document.getElementById('crosshair').style.display = 'none';
  }
}

function drawGroundLine(a, b) {
  const ca = worldToCamera(a);
  const cb = worldToCamera(b);
  // Отсечение: если обе точки за камерой — пропускаем
  if (ca.z <= 0.1 && cb.z <= 0.1) return;
  // Простая отрисовка (без clipping линией)
  const pa = ca.z > 0.1 ? project(ca) : null;
  const pb = cb.z > 0.1 ? project(cb) : null;
  if (!pa || !pb) return;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
}

function drawTree(t) {
  // Ствол
  const trunkTop = vec(t.pos.x, t.h * 0.4, t.pos.z);
  drawLine3D(t.pos, trunkTop, '#4a2a10', 3);
  // Крона — треугольник из 3 линий
  const crownColor = 'rgba(40,90,30,0.9)';
  const topPt = vec(t.pos.x, t.h, t.pos.z);
  for (let a = 0; a < 3; a++) {
    const angle = a * Math.PI * 2 / 3;
    const basePt = vec(
      t.pos.x + Math.cos(angle) * 1.5,
      t.h * 0.4,
      t.pos.z + Math.sin(angle) * 1.5
    );
    drawLine3D(topPt, basePt, crownColor, 2);
    drawLine3D(basePt, vec(
      t.pos.x + Math.cos(angle + Math.PI * 2/3) * 1.5,
      t.h * 0.4,
      t.pos.z + Math.sin(angle + Math.PI * 2/3) * 1.5
    ), crownColor, 2);
  }
}

function drawCube(c) {
  // Рисуем 8 вершин + грани, но с вращением
  const cy = Math.cos(c.spin), sy = Math.sin(c.spin);
  const hs = 0.6;
  const corners = [
    vec(-hs, -hs, -hs), vec( hs, -hs, -hs),
    vec( hs,  hs, -hs), vec(-hs,  hs, -hs),
    vec(-hs, -hs,  hs), vec( hs, -hs,  hs),
    vec( hs,  hs,  hs), vec(-hs,  hs,  hs)
  ];
  const world = corners.map(v => {
    const rx = v.x * cy - v.z * sy;
    const rz = v.x * sy + v.z * cy;
    return vec(c.pos.x + rx, c.pos.y + v.y, c.pos.z + rz);
  });

  const cams = world.map(p => worldToCamera(p));
  const depths = cams.map(cp => cp.z);
  if (depths.some(d => d <= 0.1)) return;
  const proj = cams.map(cp => project(cp));

  // Грани
  const faces = [
    [0,1,2,3], [4,5,6,7],
    [0,1,5,4], [1,2,6,5],
    [2,3,7,6], [3,0,4,7]
  ];
  const fDepths = faces.map(f => (depths[f[0]]+depths[f[1]]+depths[f[2]]+depths[f[3]])/4);
  const order = faces.map((f, i) => i).sort((a,b) => fDepths[b] - fDepths[a]);

  for (const fi of order) {
    const f = faces[fi];
    const shade = Math.max(0.4, Math.min(1, 1 - fDepths[fi] / 100));
    // Зелёный с затенением
    const g = Math.floor(255 * shade);
    const gr = Math.floor(120 * shade);
    ctx.fillStyle = `rgb(${gr},${g},${Math.floor(80 * shade)})`;
    ctx.beginPath();
    ctx.moveTo(proj[f[0]].x, proj[f[0]].y);
    for (let k = 1; k < 4; k++) ctx.lineTo(proj[f[k]].x, proj[f[k]].y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,80,0,0.7)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ============================================================
// СТИКИ
// ============================================================
function createStick(el) {
  const knob = el.querySelector('.knob');
  const state = { x: 0, y: 0, active: false, id: null };
  const maxDist = 45;

  function setKnob(dx, dy) {
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function onStart(e) {
    e.preventDefault();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    state.id = t.identifier ?? 'mouse';
    state.active = true;
    el.classList.add('active');
    updateFromEvent(t);
  }
  function onMove(e) {
    if (!state.active) return;
    e.preventDefault();
    let t = null;
    if (e.changedTouches) {
      for (const tt of e.changedTouches) {
        if (tt.identifier === state.id) { t = tt; break; }
      }
      if (!t) return;
    } else t = e;
    updateFromEvent(t);
  }
  function onEnd(e) {
    if (!state.active) return;
    e.preventDefault();
    state.active = false; state.id = null;
    state.x = 0; state.y = 0;
    setKnob(0, 0);
    el.classList.remove('active');
  }
  function updateFromEvent(t) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) {
      dx = dx / dist * maxDist;
      dy = dy / dist * maxDist;
    }
    setKnob(dx, dy);
    state.x = dx / maxDist;
    state.y = dy / maxDist;
  }

  el.addEventListener('touchstart', onStart, { passive: false });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onEnd, { passive: false });
  el.addEventListener('touchcancel', onEnd, { passive: false });
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  return state;
}
const stickL = createStick(document.getElementById('stickL'));
const stickR = createStick(document.getElementById('stickR'));

// ============================================================
// КНОПКИ
// ============================================================
const fireBtn = document.getElementById('fireBtn');
function onFireStart(e) { e.preventDefault(); firing = true; initAudio(); }
function onFireEnd(e)   { e.preventDefault(); firing = false; }
fireBtn.addEventListener('touchstart', onFireStart, { passive: false });
fireBtn.addEventListener('touchend', onFireEnd, { passive: false });
fireBtn.addEventListener('touchcancel', onFireEnd, { passive: false });
fireBtn.addEventListener('mousedown', onFireStart);
fireBtn.addEventListener('mouseup', onFireEnd);
fireBtn.addEventListener('mouseleave', onFireEnd);

const viewBtn = document.getElementById('viewBtn');
const viewModeEl = document.getElementById('viewMode');
viewBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  viewMode = viewMode === 'fpv' ? 'tps' : 'fpv';
  viewModeEl.textContent = viewMode === 'fpv' ? 'FPV' : '3RD';
}, { passive: false });

const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  initAudio();
  if (soundEnabled) startMotors();
}, { passive: false });

// ============================================================
// СООБЩЕНИЯ / СМЕРТЬ
// ============================================================
const msgEl = document.getElementById('msg');
const flashEl = document.getElementById('flash');

function showWin() {
  msgEl.textContent = '🎉 Все кубики собраны! 🎉';
  msgEl.classList.add('show');
}

function explodeDrone() {
  if (dead) return;
  dead = true;
  playExplosion();
  spawnExplosion(drone.pos, 1.5);
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const off = vec(
        (Math.random()-0.5)*4, Math.random()*2, (Math.random()-0.5)*4
      );
      spawnExplosion(vadd(drone.pos, off), 1);
    }, i * 150);
  }
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.6s';
    flashEl.style.opacity = '0';
  });
  if (motorGain && audioCtx) motorGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
  msgEl.textContent = '💥 ДРОН РАЗБИЛСЯ 💥';
  msgEl.classList.add('show');

  setTimeout(() => {
    dead = false;
    drone.pos = vec(0, 8, 0);
    drone.vel = vec(0, 0, 0);
    velocityY = 0;
    drone.yaw = 0;
    msgEl.classList.remove('show');
    if (motorGain && audioCtx) motorGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
  }, 2500);
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  update(dt);
  render();
}
loop();

  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
