<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Симулятор дрона FPV</title>
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    -webkit-user-drag: none; box-sizing: border-box;
  }
  html, body {
    margin:0; padding:0; overflow:hidden;
    background:#000; font-family:-apple-system, sans-serif;
    touch-action: none; overscroll-behavior: none;
    position: fixed; width:100%; height:100%;
  }
  canvas { display:block; position: fixed; top:0; left:0; }

  #hud {
    position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); left:10px;
    color:#0f0; font-family:'Courier New', monospace; font-size:13px;
    text-shadow:0 0 6px #0f0;
    background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:8px;
    pointer-events:none; line-height:1.4;
    border:1px solid rgba(0,255,0,0.3);
  }
  #hud .warn { color:#f33; text-shadow:0 0 8px #f00; }

  #minimap {
    position:fixed; bottom:calc(160px + env(safe-area-inset-bottom, 0px)); left:20px;
    width:120px; height:120px; border-radius:50%;
    background:rgba(0,0,0,0.4); border:2px solid rgba(0,255,0,0.5);
    pointer-events:none; z-index:5;
  }

  #msg {
    position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:26px; font-weight:bold;
    text-shadow:0 0 20px #f00, 2px 2px 6px #000;
    display:none; text-align:center; pointer-events:none;
    padding:20px 30px; border-radius:14px; background:rgba(0,0,0,0.7);
    z-index:50;
  }
  #msg.show { display:block; }

  #crosshair {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:#0f0; font-size:22px; pointer-events:none;
    text-shadow:0 0 6px #0f0; z-index:5;
  }

  .stick {
    position:fixed; width:130px; height:130px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,255,255,0.25);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    touch-action:none; z-index:10;
  }
  .stick .knob {
    position:absolute; width:56px; height:56px; border-radius:50%;
    background:rgba(255,255,255,0.35);
    border:2px solid rgba(255,255,255,0.7);
    left:50%; top:50%; transform:translate(-50%,-50%);
  }
  .stick.active .knob { background:rgba(0,255,100,0.55); }
  #stickL { left:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }
  #stickR { right:20px; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); }

  #fireBtn {
    position:fixed;
    right:calc(170px + env(safe-area-inset-right, 0px));
    bottom:calc(60px + env(safe-area-inset-bottom, 0px));
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,80,0,0.6), rgba(200,0,0,0.6));
    border:3px solid rgba(255,200,0,0.9);
    color:#fff; font-size:34px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    text-shadow:0 0 8px #000; touch-action:none;
    box-shadow:0 0 20px rgba(255,80,0,0.5); z-index:10;
  }
  #fireBtn:active { background:radial-gradient(circle, rgba(255,200,0,0.9), rgba(255,80,0,0.9)); }

  #viewBtn, #soundBtn {
    position:fixed; right:calc(10px + env(safe-area-inset-right, 0px));
    width:60px; height:60px; border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:2px solid rgba(255,255,255,0.5);
    color:#fff; font-size:26px;
    display:flex; align-items:center; justify-content:center;
    touch-action:none; z-index:10;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  #viewBtn { top:calc(10px + env(safe-area-inset-top, 0px)); }
  #soundBtn { top:calc(80px + env(safe-area-inset-top, 0px)); }

  #flash {
    position:fixed; inset:0; background:#fff;
    pointer-events:none; opacity:0; z-index:100;
  }
  #damage {
    position:fixed; inset:0;
    pointer-events:none; opacity:0; z-index:99;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.7) 100%);
    transition: opacity 0.3s;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap"></canvas>
<div id="hud">
  <div>SCORE: <span id="score">0</span>/10</div>
  <div>ALT: <span id="alt">0</span>m</div>
  <div>SPD: <span id="spd">0</span></div>
  <div>HP: <span id="hp">2</span>/2</div>
  <div>VIEW: <span id="viewMode">FPV</span></div>
  <div id="warning" class="warn"></div>
</div>
<div id="crosshair">◎</div>
<div id="msg"></div>
<div id="flash"></div>
<div id="damage"></div>

<div class="stick" id="stickL"><div class="knob"></div></div>
<div class="stick" id="stickR"><div class="knob"></div></div>
<div id="fireBtn">🔥</div>
<div id="viewBtn">👁</div>
<div id="soundBtn">🔊</div>

<script>
// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const mctx = minimapCanvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  minimapCanvas.width = 120 * DPR;
  minimapCanvas.height = 120 * DPR;
  mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

// ============================================================
// АУДИО
// ============================================================
let audioCtx = null;
let soundEnabled = true;
let motorGain = null, motorOscs = [];

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', () => { initAudio(); startMotors(); }, { once: true });
document.addEventListener('mousedown', () => { initAudio(); startMotors(); }, { once: true });

function startMotors() {
  if (!audioCtx || motorOscs.length) return;
  motorGain = audioCtx.createGain();
  motorGain.gain.value = 0;
  motorGain.connect(audioCtx.destination);
  [110, 165, 220, 330].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i % 2 ? 'sawtooth' : 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0.03;
    osc.connect(g); g.connect(motorGain);
    osc.start();
    motorOscs.push({ osc, gain: g, base: freq });
  });
}
function updateMotorSound(throttle) {
  if (!motorGain || !audioCtx) return;
  const t = Math.max(0, Math.min(1, throttle));
  motorGain.gain.setTargetAtTime(soundEnabled ? 0.25 * t + 0.03 : 0, audioCtx.currentTime, 0.05);
  motorOscs.forEach(m => {
    m.osc.frequency.setTargetAtTime(m.base * (0.8 + t * 0.7), audioCtx.currentTime, 0.05);
  });
}

function playShoot() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const bs = Math.floor(0.15 * audioCtx.sampleRate);
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/bs, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=1.5;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start(t);
}
function playEnemyShoot() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(700, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.13);
}
function playExplosion() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const dur = 1.2;
  const bs = Math.floor(dur * audioCtx.sampleRate);
  const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bs; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/bs, 1.5);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(2000, t);
  f.frequency.exponentialRampToValueAtTime(100, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.8, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start(t);
  const osc = audioCtx.createOscillator(); osc.type='sine';
  osc.frequency.setValueAtTime(80, t);
  osc.frequency.exponentialRampToValueAtTime(25, t + 0.6);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.6, t);
  og.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
  osc.connect(og); og.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.8);
}
function playHit() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='square';
  osc.frequency.setValueAtTime(880, t);
  osc.frequency.exponentialRampToValueAtTime(1760, t + 0.08);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.16);
}
function playDamage() {
  if (!audioCtx || !soundEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type='sawtooth';
  osc.frequency.setValueAtTime(300, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.26);
}

// ============================================================
// ВЕКТОР
// ============================================================
function vec(x, y, z) { return { x, y, z }; }
function vadd(a, b) { return { x:a.x+b.x, y:a.y+b.y, z:a.z+b.z }; }
function vsub(a, b) { return { x:a.x-b.x, y:a.y-b.y, z:a.z-b.z }; }
function vscale(a, s) { return { x:a.x*s, y:a.y*s, z:a.z*s }; }
function vlen(a) { return Math.hypot(a.x, a.y, a.z); }
function vnorm(a) { const l = vlen(a) || 1; return { x:a.x/l, y:a.y/l, z:a.z/l }; }
function vdot(a, b) { return a.x*b.x + a.y*b.y + a.z*b.z; }
function vcross(a, b) {
  return { x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x };
}

// ============================================================
// МИР
// ============================================================
const WORLD = {
  size: 300,           // половина размера карты
  cubeCount: 10,
  treeCount: 80,
  buildingCount: 25
};

const drone = {
  pos: vec(0, 8, 0),
  yaw: 0,
  pitch: 0,
  roll: 0,
  vel: vec(0, 0, 0),
  hp: 2,
  maxHp: 2,
  invuln: 0   // неуязвимость после урона (короткая)
};
let velocityY = 0;
let score = 0;
let dead = false;
let firing = false;
let fireCooldown = 0;
let viewMode = 'fpv';

// Кубики
const cubes = [];
for (let i = 0; i < WORLD.cubeCount; i++) {
  cubes.push({
    pos: vec(
      (Math.random()-0.5) * WORLD.size * 1.6,
      Math.random() * 20 + 3,
      (Math.random()-0.5) * WORLD.size * 1.6
    ),
    spin: Math.random() * Math.PI * 2
  });
}

// Деревья
const trees = [];
for (let i = 0; i < WORLD.treeCount; i++) {
  trees.push({
    pos: vec(
      (Math.random()-0.5) * WORLD.size * 2,
      0,
      (Math.random()-0.5) * WORLD.size * 2
    ),
    h: 3 + Math.random() * 6
  });
}

// Здания (коробки)
const buildings = [];
for (let i = 0; i < WORLD.buildingCount; i++) {
  const w = 3 + Math.random() * 6;
  const h = 4 + Math.random() * 12;
  const d = 3 + Math.random() * 6;
  buildings.push({
    pos: vec(
      (Math.random()-0.5) * WORLD.size * 1.8,
      0,
      (Math.random()-0.5) * WORLD.size * 1.8
    ),
    size: vec(w, h, d),
    color: ['#888', '#a55', '#558', '#666', '#964'][Math.floor(Math.random()*5)]
  });
}

// ПВО-турели
const turrets = [];
const TURRET_COUNT = 6;
const TURRET_RANGE = 25;      // дистанция обнаружения
const TURRET_FIRE_RATE = 1.2; // выстрел раз в 1.2 сек
const TURRET_DAMAGE = 1;      // 1 пуля = 1 hp (2 hp = 2 пули)

for (let i = 0; i < TURRET_COUNT; i++) {
  turrets.push({
    pos: vec(
      (Math.random()-0.5) * WORLD.size * 1.5,
      0,
      (Math.random()-0.5) * WORLD.size * 1.5
    ),
    yaw: Math.random() * Math.PI * 2,
    cooldown: 0,
    alive: true,
    hp: 3
  });
}

// Пули игрока
const bullets = [];
// Вражеские пули
const enemyBullets = [];
// Взрывы
const explosions = [];
// Вспышки выстрелов
const muzzleFlashes = [];

// ============================================================
// ПРОЕКЦИЯ
// ============================================================
const FOV = 500;

let cameraPos = vec(0, 8, -8);
let cameraYaw = 0;
let cameraPitch = 0;

function worldToCamera(p) {
  const dx = p.x - cameraPos.x;
  const dy = p.y - cameraPos.y;
  const dz = p.z - cameraPos.z;

  const cosY = Math.cos(-cameraYaw), sinY = Math.sin(-cameraYaw);
  const x1 = dx * cosY - dz * sinY;
  const z1 = dx * sinY + dz * cosY;

  const cosP = Math.cos(-cameraPitch), sinP = Math.sin(-cameraPitch);
  const y2 = dy * cosP - z1 * sinP;
  const z2 = dy * sinP + z1 * cosP;

  return vec(x1, y2, z2);
}

function project(p) {
  if (p.z <= 0.1) return null;
  const scale = FOV / p.z;
  return { x: W/2 + p.x * scale, y: H/2 - p.y * scale, scale, z: p.z };
}

// ============================================================
// РИСОВАНИЕ 3D
// ============================================================
function shadeColor(hex, factor) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

function drawBox3D(center, size, color, rotationY, alphaOverride) {
  const hs = { x: size.x/2, y: size.y/2, z: size.z/2 };
  const corners = [
    vec(-hs.x, -hs.y, -hs.z), vec( hs.x, -hs.y, -hs.z),
    vec( hs.x,  hs.y, -hs.z), vec(-hs.x,  hs.y, -hs.z),
    vec(-hs.x, -hs.y,  hs.z), vec( hs.x, -hs.y,  hs.z),
    vec( hs.x,  hs.y,  hs.z), vec(-hs.x,  hs.y,  hs.z)
  ];
  const cy = Math.cos(rotationY || 0), sy = Math.sin(rotationY || 0);
  const world = corners.map(c => {
    const rx = c.x * cy - c.z * sy;
    const rz = c.x * sy + c.z * cy;
    return vec(center.x + rx, center.y + c.y, center.z + rz);
  });

  const cams = world.map(p => worldToCamera(p));
  const depths = cams.map(cp => cp.z);
  if (depths.some(d => d <= 0.1)) return;

  const proj = cams.map(cp => project(cp));

  const faces = [
    [0,1,2,3], [4,5,6,7],
    [0,1,5,4], [1,2,6,5],
    [2,3,7,6], [3,0,4,7]
  ];
  const faceDepths = faces.map(f => (depths[f[0]]+depths[f[1]]+depths[f[2]]+depths[f[3]])/4);
  const order = faces.map((f, i) => i).sort((a, b) => faceDepths[b] - faceDepths[a]);

  for (const fi of order) {
    const f = faces[fi];
    const d = faceDepths[fi];
    const shade = Math.max(0.35, Math.min(1, 1 - d / 150));

    let fillCol = shadeColor(color, shade);
    if (alphaOverride != null) {
      const r = parseInt(color.slice(1,3),16) * shade;
      const g = parseInt(color.slice(3,5),16) * shade;
      const b = parseInt(color.slice(5,7),16) * shade;
      fillCol = `rgba(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)},${alphaOverride})`;
    }

    ctx.fillStyle = fillCol;
    ctx.beginPath();
    ctx.moveTo(proj[f[0]].x, proj[f[0]].y);
    for (let k = 1; k < 4; k++) ctx.lineTo(proj[f[k]].x, proj[f[k]].y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// ============================================================
// ДРОН
// ============================================================
let rotorSpin = 0;

function drawDrone() {
  if (viewMode === 'fpv') return;

  const scale = 1.2;
  // Корпус
  drawBox3D(drone.pos, vec(1.0*scale, 0.35*scale, 1.4*scale), '#1a1a1a', drone.yaw);
  // Красная крышка
  drawBox3D(
    vec(drone.pos.x, drone.pos.y + 0.25*scale, drone.pos.z),
    vec(0.8*scale, 0.1*scale, 1.0*scale), '#d32f2f', drone.yaw
  );
  // Лучи + моторы + винты
  const armPos = [
    vec(-0.9, 0, -0.9), vec(0.9, 0, -0.9),
    vec(-0.9, 0, 0.9), vec(0.9, 0, 0.9)
  ];
  const cy = Math.cos(drone.yaw), sy = Math.sin(drone.yaw);

  armPos.forEach((p, i) => {
    const rx = p.x * cy - p.z * sy;
    const rz = p.x * sy + p.z * cy;
    const worldP = vec(drone.pos.x + rx*scale, drone.pos.y + p.y, drone.pos.z + rz*scale);

    drawBox3D(
      vec(worldP.x, worldP.y + 0.05, worldP.z),
      vec(0.35, 0.2, 0.35), '#444', drone.yaw
    );

    // Винты
    const bladeAngle = rotorSpin * (i % 2 ? 1 : -1) + i;
    for (let k = 0; k < 2; k++) {
      const a = bladeAngle + k * Math.PI/2;
      const bx = Math.cos(a) * 0.4 * scale;
      const bz = Math.sin(a) * 0.4 * scale;
      const p1 = vec(worldP.x - bx, worldP.y + 0.2, worldP.z - bz);
      const p2 = vec(worldP.x + bx, worldP.y + 0.2, worldP.z + bz);
      drawLine3D(p1, p2, 'rgba(200,200,200,0.85)', 3);
    }
  });
}

function drawLine3D(a, b, color, width) {
  const ca = worldToCamera(a);
  const cb = worldToCamera(b);
  if (ca.z <= 0.1 || cb.z <= 0.1) return;
  const pa = project(ca);
  const pb = project(cb);
  if (!pa || !pb) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = width || 1;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
}

function drawTree(t) {
  const trunkTop = vec(t.pos.x, t.h * 0.4, t.pos.z);
  drawLine3D(t.pos, trunkTop, '#4a2a10', 3);
  const crownColor = 'rgba(40,90,30,0.95)';
  const topPt = vec(t.pos.x, t.h, t.pos.z);
  for (let a = 0; a < 3; a++) {
    const angle = a * Math.PI * 2 / 3;
    const basePt = vec(
      t.pos.x + Math.cos(angle) * 1.5,
      t.h * 0.4,
      t.pos.z + Math.sin(angle) * 1.5
    );
    drawLine3D(topPt, basePt, crownColor, 2);
    drawLine3D(basePt, vec(
      t.pos.x + Math.cos(angle + Math.PI * 2/3) * 1.5,
      t.h * 0.4,
      t.pos.z + Math.sin(angle + Math.PI * 2/3) * 1.5
    ), crownColor, 2);
  }
}

function drawCube(c) {
  const cy = Math.cos(c.spin), sy = Math.sin(c.spin);
  const hs = 0.6;
  const corners = [
    vec(-hs, -hs, -hs), vec( hs, -hs, -hs),
    vec( hs,  hs, -hs), vec(-hs,  hs, -hs),
    vec(-hs, -hs,  hs), vec( hs, -hs,  hs),
    vec( hs,  hs,  hs), vec(-hs,  hs,  hs)
  ];
  const world = corners.map(v => {
    const rx = v.x * cy - v.z * sy;
    const rz = v.x * sy + v.z * cy;
    return vec(c.pos.x + rx, c.pos.y + v.y, c.pos.z + rz);
  });
  const cams = world.map(p => worldToCamera(p));
  const depths = cams.map(cp => cp.z);
  if (depths.some(d => d <= 0.1)) return;
  const proj = cams.map(cp => project(cp));

  const faces = [
    [0,1,2,3], [4,5,6,7],
    [0,1,5,4], [1,2,6,5],
    [2,3,7,6], [3,0,4,7]
  ];
  const fDepths = faces.map(f => (depths[f[0]]+depths[f[1]]+depths[f[2]]+depths[f[3]])/4);
  const order = faces.map((f, i) => i).sort((a,b) => fDepths[b] - fDepths[a]);

  for (const fi of order) {
    const f = faces[fi];
    const shade = Math.max(0.4, Math.min(1, 1 - fDepths[fi] / 100));
    const g = Math.floor(255 * shade);
    const gr = Math.floor(120 * shade);
    ctx.fillStyle = `rgb(${gr},${g},${Math.floor(80*shade)})`;
    ctx.beginPath();
    ctx.moveTo(proj[f[0]].x, proj[f[0]].y);
    for (let k = 1; k < 4; k++) ctx.lineTo(proj[f[k]].x, proj[f[k]].y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,80,0,0.7)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawTurret(t) {
  // Основание — цилиндр (аппроксимируем кубом)
  drawBox3D(vec(t.pos.x, t.pos.y + 0.5, t.pos.z), vec(1.8, 1, 1.8), '#333', 0);
  // Верхняя часть (вращается) — куб
  drawBox3D(vec(t.pos.x, t.pos.y + 1.3, t.pos.z), vec(1.2, 0.8, 1.2), '#555', t.yaw);
  // Ствол — линия вперёд
  const dir = vec(Math.sin(t.yaw), 0, Math.cos(t.yaw));
  const barrelStart = vec(t.pos.x, t.pos.y + 1.3, t.pos.z);
  const barrelEnd = vec(
    t.pos.x + dir.x * 1.5,
    t.pos.y + 1.6,
    t.pos.z + dir.z * 1.5
  );
  drawLine3D(barrelStart, barrelEnd, '#222', 5);
  // Красный огонёк (индикатор)
  const ledWorld = vec(t.pos.x + dir.x * 1.7, t.pos.y + 1.6, t.pos.z + dir.z * 1.7);
  const ledCam = worldToCamera(ledWorld);
  const ledProj = project(ledCam);
  if (ledProj) {
    ctx.fillStyle = t.cooldown > 0.3 ? '#f00' : '#800';
    ctx.beginPath();
    ctx.arc(ledProj.x, ledProj.y, Math.max(2, ledProj.scale * 0.08), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
// ОБНОВЛЕНИЕ
// ============================================================
function update(dt) {
  rotorSpin += dt * 40;

  if (!dead) {
    // === Ввод ===
    const yawInput = stickR.x;
    const altInput = stickR.y;
    const fwdInput = -stickL.y;
    const strafeInput = stickL.x;

    drone.yaw -= yawInput * 2.2 * dt;

    const fwd = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const right = vec(Math.cos(drone.yaw), 0, -Math.sin(drone.yaw));
    const targetV = {
      x: fwd.x * fwdInput * 18 + right.x * strafeInput * 18,
      y: 0,
      z: fwd.z * fwdInput * 18 + right.z * strafeInput * 18
    };
    drone.vel.x += (targetV.x - drone.vel.x) * 0.15;
    drone.vel.z += (targetV.z - drone.vel.z) * 0.15;

    const targetVY = -altInput * 10;
    velocityY += (targetVY - velocityY) * 0.15;

    drone.pos.x += drone.vel.x * dt;
    drone.pos.z += drone.vel.z * dt;
    drone.pos.y += velocityY * dt;

    // Ограничения карты
    const lim = WORLD.size;
    if (drone.pos.x > lim) { drone.pos.x = lim; drone.vel.x = 0; }
    if (drone.pos.x < -lim) { drone.pos.x = -lim; drone.vel.x = 0; }
    if (drone.pos.z > lim) { drone.pos.z = lim; drone.vel.z = 0; }
    if (drone.pos.z < -lim) { drone.pos.z = -lim; drone.vel.z = 0; }
    if (drone.pos.y > 60) { drone.pos.y = 60; velocityY = 0; }
    if (drone.pos.y < 0) drone.pos.y = 0;

    drone.pitch = -fwdInput * 0.25;
    drone.roll = -strafeInput * 0.2;

    const throttle = Math.min(1, Math.abs(fwdInput)*0.5 + Math.abs(strafeInput)*0.3 + Math.abs(altInput)*0.4 + 0.15);
    updateMotorSound(throttle);

    // Неуязвимость тикает
    if (drone.invuln > 0) drone.invuln -= dt;

    // === Стрельба игрока ===
    fireCooldown -= dt;
    if (firing && fireCooldown <= 0) {
      fireCooldown = 0.12;
      playShoot();
      const dir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
      bullets.push({
        pos: vec(drone.pos.x + dir.x * 1.2, drone.pos.y - 0.3, drone.pos.z + dir.z * 1.2),
        vel: vec(dir.x * 70, 0, dir.z * 70),
        life: 0
      });
      muzzleFlashes.push({
        pos: vec(drone.pos.x + dir.x * 1.4, drone.pos.y - 0.3, drone.pos.z + dir.z * 1.4),
        life: 0
      });
    }

    // === Пули игрока ===
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.pos.x += b.vel.x * dt;
      b.pos.z += b.vel.z * dt;
      b.life += dt;

      let hit = false;
      // Кубики
      for (let j = cubes.length - 1; j >= 0; j--) {
        if (vlen(vsub(b.pos, cubes[j].pos)) < 1.2) {
          cubes.splice(j, 1);
          score++;
          document.getElementById('score').textContent = score;
          playHit();
          spawnExplosion(cubes[j] ? cubes[j].pos : b.pos, 0.6);
          if (score >= 10) showWin();
          hit = true; break;
        }
      }
      // Турели
      if (!hit) {
        for (let j = turrets.length - 1; j >= 0; j--) {
          const t = turrets[j];
          if (vlen(vsub(b.pos, vec(t.pos.x, t.pos.y + 1, t.pos.z))) < 1.4) {
            t.hp--;
            playHit();
            if (t.hp <= 0) {
              playExplosion();
              spawnExplosion(vec(t.pos.x, t.pos.y + 1, t.pos.z), 1.5);
              turrets.splice(j, 1);
            }
            hit = true; break;
          }
        }
      }
      if (hit || b.life > 3 || b.pos.y < 0 || Math.abs(b.pos.x) > WORLD.size || Math.abs(b.pos.z) > WORLD.size) {
        bullets.splice(i, 1);
      }
    }

    // === Кубики ===
    for (let i = cubes.length - 1; i >= 0; i--) {
      const c = cubes[i];
      c.spin += dt * 1.5;
      if (vlen(vsub(drone.pos, c.pos)) < 1.5) {
        cubes.splice(i, 1);
        score++;
        document.getElementById('score').textContent = score;
        playHit();
        if (score >= 10) showWin();
      }
    }

    // === Турели ===
    let nearestTurret = Infinity;
    turrets.forEach(t => {
      const d = vlen(vsub(t.pos, drone.pos));
      if (d < nearestTurret) nearestTurret = d;

      if (d < TURRET_RANGE) {
        // Целимся в дрон
        const dx = drone.pos.x - t.pos.x;
        const dz = drone.pos.z - t.pos.z;
        const targetYaw = Math.atan2(dx, dz);
        // Плавный поворот
        let dYaw = targetYaw - t.yaw;
        while (dYaw > Math.PI) dYaw -= Math.PI * 2;
        while (dYaw < -Math.PI) dYaw += Math.PI * 2;
        t.yaw += dYaw * Math.min(1, dt * 4);

        t.cooldown -= dt;
        if (t.cooldown <= 0) {
          t.cooldown = TURRET_FIRE_RATE;

          // Стреляем с упреждением и небольшим разбросом
          const lead = 0.6;
          const predictPos = vadd(drone.pos, vscale(drone.vel, lead));
          const shotDir = vnorm(vsub(predictPos, vec(t.pos.x, t.pos.y + 1.3, t.pos.z)));

          // Разброс
          shotDir.x += (Math.random() - 0.5) * 0.15;
          shotDir.y += (Math.random() - 0.5) * 0.1;
          shotDir.z += (Math.random() - 0.5) * 0.15;
          const nd = vnorm(shotDir);

          enemyBullets.push({
            pos: vec(t.pos.x, t.pos.y + 1.3, t.pos.z),
            vel: vscale(nd, 35),
            life: 0
          });
          playEnemyShoot();

          // Вспышка
          muzzleFlashes.push({
            pos: vec(t.pos.x + nd.x * 1.6, t.pos.y + 1.6, t.pos.z + nd.z * 1.6),
            life: 0,
            color: 'orange'
          });
        }
      } else {
        t.cooldown = Math.max(0, t.cooldown - dt);
      }
    });

    // Предупреждение
    const warningEl = document.getElementById('warning');
    if (nearestTurret < TURRET_RANGE && nearestTurret !== Infinity) {
      warningEl.textContent = '⚠ ПВО РЯДОМ';
    } else {
      warningEl.textContent = '';
    }

    // === Вражеские пули ===
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.pos.x += b.vel.x * dt;
      b.pos.y += b.vel.y * dt;
      b.pos.z += b.vel.z * dt;
      b.life += dt;

      if (vlen(vsub(b.pos, drone.pos)) < 1.0 && drone.invuln <= 0) {
        damageDrone(TURRET_DAMAGE);
        spawnExplosion(b.pos, 0.3);
        enemyBullets.splice(i, 1);
        continue;
      }
      if (b.life > 4 || b.pos.y < 0) enemyBullets.splice(i, 1);
    }

    // === Столкновение с землёй ===
    const speedTotal = Math.hypot(drone.vel.x, drone.vel.z, velocityY);
    if (drone.pos.y <= 0.6) {
      if (speedTotal > 6 || velocityY < -6) {
        explodeDrone();
      } else {
        drone.pos.y = 0.6;
        velocityY = 0;
      }
    }

    document.getElementById('alt').textContent = drone.pos.y.toFixed(1);
    document.getElementById('spd').textContent = speedTotal.toFixed(1);
  }

  // Взрывы
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life += dt;
    e.particles.forEach(p => {
      p.vel.y -= 9.8 * dt;
      p.pos.x += p.vel.x * dt;
      p.pos.y += p.vel.y * dt;
      p.pos.z += p.vel.z * dt;
    });
    if (e.life >= e.maxLife) explosions.splice(i, 1);
  }

  // Вспышки
  for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
    muzzleFlashes[i].life += dt;
    if (muzzleFlashes[i].life > 0.06) muzzleFlashes.splice(i, 1);
  }

  // ============================================================
  // КАМЕРА
  // ============================================================
  if (viewMode === 'fpv') {
    const dir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const targetPos = vec(
      drone.pos.x + dir.x * 0.3,
      drone.pos.y + 0.15,
      drone.pos.z + dir.z * 0.3
    );
    cameraPos.x += (targetPos.x - cameraPos.x) * 0.5;
    cameraPos.y += (targetPos.y - cameraPos.y) * 0.5;
    cameraPos.z += (targetPos.z - cameraPos.z) * 0.5;

    let dYaw = drone.yaw - cameraYaw;
    while (dYaw > Math.PI) dYaw -= Math.PI * 2;
    while (dYaw < -Math.PI) dYaw += Math.PI * 2;
    cameraYaw += dYaw * 0.5;
    cameraPitch += (drone.pitch - cameraPitch) * 0.3;
  } else {
    // 3-е лицо — камера строго сзади и выше дрона, всегда смотрит на дрон
    const backDir = vec(Math.sin(drone.yaw), 0, Math.cos(drone.yaw));
    const targetPos = vec(
      drone.pos.x - backDir.x * 8,
      drone.pos.y + 3.5,
      drone.pos.z - backDir.z * 8
    );
    cameraPos.x += (targetPos.x - cameraPos.x) * 0.12;
    cameraPos.y += (targetPos.y - cameraPos.y) * 0.12;
    cameraPos.z += (targetPos.z - cameraPos.z) * 0.12;

    // Жёсткая привязка yaw камеры к yaw дрона
    let dYaw = drone.yaw - cameraYaw;
    while (dYaw > Math.PI) dYaw -= Math.PI * 2;
    while (dYaw < -Math.PI) dYaw += Math.PI * 2;
    cameraYaw += dYaw * 0.15;

    // Смотрим вниз на дрон
    cameraPitch += (-0.25 - cameraPitch) * 0.15;
  }
}

function spawnExplosion(pos, scale) {
  scale = scale || 1;
  const count = Math.floor(40 * scale);
  const particles = [];
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const speed = (3 + Math.random() * 8) * scale;
    particles.push({
      pos: vec(pos.x, pos.y, pos.z),
      vel: vec(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.cos(phi) * speed,
        Math.sin(phi) * Math.sin(theta) * speed
      ),
      size: (0.3 + Math.random() * 0.5) * scale
    });
  }
  explosions.push({ particles, life: 0, maxLife: 1.5 });
}

// ============================================================
// РЕНДЕР
// ============================================================
function render() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#c8e6f5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const horizonY = H/2 + Math.tan(cameraPitch) * FOV;
  ctx.fillStyle = '#4a8b3a';
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Сетка
  const gridSize = 10;
  const gridRange = 25;
  const camX = Math.round(cameraPos.x / gridSize) * gridSize;
  const camZ = Math.round(cameraPos.z / gridSize) * gridSize;
  ctx.lineWidth = 1;
  for (let i = -gridRange; i <= gridRange; i++) {
    const alpha = 0.18 * (1 - Math.abs(i) / gridRange);
    ctx.strokeStyle = `rgba(0,0,0,${alpha})`;
    drawGroundLine(
      vec(camX + i * gridSize, 0, camZ - gridRange * gridSize),
      vec(camX + i * gridSize, 0, camZ + gridRange * gridSize)
    );
    drawGroundLine(
      vec(camX - gridRange * gridSize, 0, camZ + i * gridSize),
      vec(camX + gridRange * gridSize, 0, camZ + i * gridSize)
    );
  }

  // Здания
  buildings.forEach(b => {
    if (vlen(vsub(b.pos, cameraPos)) > 120) return;
    drawBox3D(
      vec(b.pos.x, b.pos.y + b.size.y/2, b.pos.z),
      b.size, b.color, 0
    );
  });

  // Турели
  turrets.forEach(t => {
    if (vlen(vsub(t.pos, cameraPos)) > 120) return;
    drawTurret(t);
  });

  // Деревья
  trees.forEach(t => {
    if (vlen(vsub(t.pos, cameraPos)) > 90) return;
    drawTree(t);
  });

  // Кубики
  cubes.forEach(c => {
    if (vlen(vsub(c.pos, cameraPos)) > 120) return;
    drawCube(c);
  });

  // Пули игрока
  bullets.forEach(b => {
    const cp = worldToCamera(b.pos);
    const p = project(cp);
    if (!p) return;
    const r = Math.max(2, p.scale * 0.12);
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*3);
    g.addColorStop(0, 'rgba(255,200,0,0.8)');
    g.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r*3, 0, Math.PI * 2); ctx.fill();
  });

  // Вражеские пули (красные)
  enemyBullets.forEach(b => {
    const cp = worldToCamera(b.pos);
    const p = project(cp);
    if (!p) return;
    const r = Math.max(2.5, p.scale * 0.15);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r*3);
    g.addColorStop(0, 'rgba(255,100,100,1)');
    g.addColorStop(0.5, 'rgba(255,50,0,0.7)');
    g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r*3, 0, Math.PI * 2); ctx.fill();
  });

  // Вспышки
  muzzleFlashes.forEach(f => {
    const cp = worldToCamera(f.pos);
    const p = project(cp);
    if (!p) return;
    const r = p.scale * 0.6 * (1 - f.life / 0.06);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(255,255,180,1)');
    g.addColorStop(0.4, 'rgba(255,180,0,0.7)');
    g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  });

  // Дрон (3-е лицо)
  drawDrone();

  // Взрывы
  explosions.forEach(e => {
    const t = e.life / e.maxLife;
    const alpha = 1 - t;
    e.particles.forEach(p => {
      const cp = worldToCamera(p.pos);
      const proj = project(cp);
      if (!proj) return;
      const r = Math.max(1, proj.scale * p.size);
      const rCol = 255;
      const gCol = Math.floor(255 * (1 - t) + 100 * t);
      const bCol = Math.floor(50 * (1 - t));
      ctx.fillStyle = `rgba(${rCol},${gCol},${bCol},${alpha})`;
      ctx.beginPath(); ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2); ctx.fill();
    });
  });

  // Прицел
  document.getElementById('crosshair').style.display = viewMode === 'fpv' ? 'block' : 'none';

  // Мини-карта
  renderMinimap();
}

function drawGroundLine(a, b) {
  const ca = worldToCamera(a);
  const cb = worldToCamera(b);
  if (ca.z <= 0.1 || cb.z <= 0.1) return;
  const pa = project(ca);
  const pb = project(cb);
  if (!pa || !pb) return;
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y);
  ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
}

// ============================================================
// МИНИ-КАРТА
// ============================================================
function renderMinimap() {
  const MM = 120;
  const centerX = MM / 2;
  const centerY = MM / 2;
  const mapRadius = 100; // радиус обзора на миникарте (в юнитах мира)

  mctx.clearRect(0, 0, MM, MM);
  mctx.fillStyle = 'rgba(20,40,20,0.6)';
  mctx.beginPath();
  mctx.arc(centerX, centerY, MM/2 - 2, 0, Math.PI * 2);
  mctx.fill();

  // Круг обзора
  mctx.strokeStyle = 'rgba(0,255,0,0.15)';
  mctx.beginPath();
  mctx.arc(centerX, centerY, MM/2 * 0.66, 0, Math.PI * 2);
  mctx.stroke();
  mctx.beginPath();
  mctx.arc(centerX, centerY, MM/2 * 0.33, 0, Math.PI * 2);
  mctx.stroke();

  function worldToMap(wx, wz) {
    const dx = wx - drone.pos.x;
    const dz = wz - drone.pos.z;
    // Вращаем так, чтобы "вперёд" дрона было вверх
    const cosY = Math.cos(-drone.yaw), sinY = Math.sin(-drone.yaw);
    const rx = dx * cosY - dz * sinY;
    const rz = dx * sinY + dz * cosY;
    const scale = (MM/2 - 4) / mapRadius;
    return {
      x: centerX + rx * scale,
      y: centerY - rz * scale
    };
  }

  // Кубики (зелёные)
  cubes.forEach(c => {
    const p = worldToMap(c.pos.x, c.pos.z);
    if (Math.hypot(p.x - centerX, p.y - centerY) > MM/2 - 6) return;
    mctx.fillStyle = '#0f8';
    mctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });

  // Турели (красные)
  turrets.forEach(t => {
    const p = worldToMap(t.pos.x, t.pos.z);
    if (Math.hypot(p.x - centerX, p.y - centerY) > MM/2 - 6) return;
    mctx.fillStyle = '#f33';
    mctx.beginPath();
    mctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    mctx.fill();
  });

  // Дрон в центре (стрелка)
  mctx.save();
  mctx.translate(centerX, centerY);
  mctx.fillStyle = '#0f0';
  mctx.beginPath();
  mctx.moveTo(0, -6);
  mctx.lineTo(4, 4);
  mctx.lineTo(0, 2);
  mctx.lineTo(-4, 4);
  mctx.closePath();
  mctx.fill();
  mctx.restore();
}

// ============================================================
// СТИКИ
// ============================================================
function createStick(el) {
  const knob = el.querySelector('.knob');
  const state = { x: 0, y: 0, active: false, id: null };
  const maxDist = 45;

  function setKnob(dx, dy) {
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function onStart(e) {
    e.preventDefault();
    const t = e.changedTouches ? e.changedTouches[0] : e;
    state.id = t.identifier ?? 'mouse';
    state.active = true;
    el.classList.add('active');
    updateFromEvent(t);
  }
  function onMove(e) {
    if (!state.active) return;
    e.preventDefault();
    let t = null;
    if (e.changedTouches) {
      for (const tt of e.changedTouches) {
        if (tt.identifier === state.id) { t = tt; break; }
      }
      if (!t) return;
    } else t = e;
    updateFromEvent(t);
  }
  function onEnd(e) {
    if (!state.active) return;
    e.preventDefault();
    state.active = false; state.id = null;
    state.x = 0; state.y = 0;
    setKnob(0, 0);
    el.classList.remove('active');
  }
  function updateFromEvent(t) {
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    if (dist > maxDist) {
      dx = dx / dist * maxDist;
      dy = dy / dist * maxDist;
    }
    setKnob(dx, dy);
    state.x = dx / maxDist;
    state.y = dy / maxDist;
  }

  el.addEventListener('touchstart', onStart, { passive: false });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onEnd, { passive: false });
  el.addEventListener('touchcancel', onEnd, { passive: false });
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  return state;
}

fireBtn.addEventListener('touchend', onFireEnd, { passive: false });

// ============================================================
// СООБЩЕНИЯ / СМЕРТЬ
// ============================================================
const msgEl = document.getElementById('msg');
const flashEl = document.getElementById('flash');
const damageEl = document.getElementById('damage');
const hpEl = document.getElementById('hp');

function showWin() {
  msgEl.textContent = '🎉 Все кубики собраны! 🎉';
  msgEl.classList.add('show');
}

function damageDrone(amount) {
  if (dead || drone.invuln > 0) return;
  drone.hp -= amount;
  drone.invuln = 1.0; // 1 секунда неуязвимости
  playDamage();
  hpEl.textContent = Math.max(0, drone.hp);

  // Красная вспышка
  damageEl.style.transition = 'none';
  damageEl.style.opacity = '1';
  requestAnimationFrame(() => {
    damageEl.style.transition = 'opacity 0.5s';
    damageEl.style.opacity = '0';
  });

  if (drone.hp <= 0) {
    explodeDrone();
  }
}

function explodeDrone() {
  if (dead) return;
  dead = true;
  playExplosion();
  spawnExplosion(drone.pos, 1.5);
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const off = vec((Math.random()-0.5)*4, Math.random()*2, (Math.random()-0.5)*4);
      spawnExplosion(vadd(drone.pos, off), 1);
    }, i * 150);
  }
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.9';
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.6s';
    flashEl.style.opacity = '0';
  });
  if (motorGain && audioCtx) motorGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
  msgEl.textContent = '💥 ДРОН СБИТ 💥';
  msgEl.classList.add('show');

  setTimeout(() => {
    dead = false;
    drone.pos = vec(0, 8, 0);
    drone.vel = vec(0, 0, 0);
    velocityY = 0;
    drone.yaw = 0;
    drone.hp = drone.maxHp;
    drone.invuln = 2;
    hpEl.textContent = drone.hp;
    msgEl.classList.remove('show');
    if (motorGain && audioCtx) motorGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
  }, 2500);
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
}
loop();

  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
